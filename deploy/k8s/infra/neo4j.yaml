apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: medibrain-neo4j
  namespace: medibrain
  labels:
    app: medibrain-neo4j
spec:
  serviceName: medibrain-neo4j
  replicas: 1
  selector:
    matchLabels:
      app: medibrain-neo4j
  template:
    metadata:
      labels:
        app: medibrain-neo4j
    spec:
      containers:
        - name: neo4j
          image: neo4j:5-community
          ports:
            - containerPort: 7474
            - containerPort: 7687
          env:
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: medibrain-secret
                  key: NEO4J_AUTH
            - name: NEO4J_server_memory_pagecache_size
              value: '512m'
            - name: NEO4J_dbms_memory_transaction_total_max
              value: '2G'
            - name: NEO4J_server_memory_heap_max__size
              value: '2G'
            - name: NEO4J_server_memory_heap_initial__size
              value: '512m'
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 200m
              memory: 2Gi
            limits:
              cpu: '2'
              memory: 4Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: medibrain-neo4j
  namespace: medibrain
  labels:
    app: medibrain-neo4j
spec:
  clusterIP: None
  selector:
    app: medibrain-neo4j
  ports:
    - name: http
      port: 7474
      targetPort: 7474
    - name: bolt
      port: 7687
      targetPort: 7687
