apiVersion: apps/v1
kind: Deployment
metadata:
  name: medibrain-web
  namespace: medibrain
  labels:
    app: medibrain-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medibrain-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: medibrain-web
    spec:
      containers:
        - name: web
          image: medibrain-web:conversations-20261014
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
