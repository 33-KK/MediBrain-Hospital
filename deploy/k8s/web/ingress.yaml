apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medibrain
  namespace: medibrain
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: '120'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '120'
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: medibrain-server
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: medibrain-web
                port:
                  number: 80
