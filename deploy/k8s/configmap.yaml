apiVersion: v1
kind: ConfigMap
metadata:
  name: medibrain-config
  namespace: medibrain
data:
  NODE_ENV: production
  PORT: '3000'
  JWT_EXPIRES: 7d
  LLM_PROVIDER: ollama
  LLM_MODEL: qwen2.5:7b
  OLLAMA_MODEL: qwen2.5:7b
  OLLAMA_BASE_URL: http://host.docker.internal:11434
  # 向量检索（问答兜底）：宿主机 Ollama（bge-m3）+ 宿主机 Milvus
  EMBEDDING_MODEL: bge-m3
  EMBEDDING_BASE_URL: http://host.docker.internal:11434
  MILVUS_URI: host.docker.internal:19540
  MILVUS_COLLECTION: entities
  EMBEDDING_TOP_K: '5'
  EMBEDDING_THRESHOLD: '0.6'
